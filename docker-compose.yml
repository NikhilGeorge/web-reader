version: '3.8'

services:
  web-reader:
    build: .
    container_name: web-reader
    ports:
      - "8000:8000"
    volumes:
      # Persist file-based storage (user data, articles, highlights)
      - web-reader-data:/app/data
    environment:
      # Application settings
      - APP_NAME=Web Reader
      - DEBUG=false

      # Security - CHANGE THIS IN PRODUCTION!
      - SECRET_KEY=your-super-secret-key-change-this-in-production-please

      # Token expiration (in minutes) - 7 days
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080

      # Authentication (set DISABLE_AUTH=true for testing without login)
      - DISABLE_AUTH=false
      - DEFAULT_USER=demo

      # File storage path
      - DATA_PATH=/app/data

      # CORS (adjust as needed)
      - CORS_ORIGINS=["*"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/config')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  web-reader-data:
    driver: local
